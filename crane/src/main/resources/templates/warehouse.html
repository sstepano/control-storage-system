<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="css/bootstrap.min.css" rel="stylesheet">
    <script src="js/jquery.min.js"></script>
    <script src="js/sockjs.min.js"></script>
    <script src="js/stomp.min.js"></script>
    <script src="js/warehouse.js"></script>
    <title>CONTROL I</title>
</head>

<body class="d-flex flex-column min-vh-100">
    <header>
        <div class="p-3 bg-dark text-white">
            <div class="container">
                <h2>CONTROL 1</h2>
            </div>
        </div>
    </header>

    <div class="container-fluid">
        <div class="row py-3 ps-3">
            <div class="col p-0">
                <div class="card shadow-sm rounded">
                    <div class="card-header bg-dark text-white">Ulaz / Izlaz</div>
                    <div class="card-body">

                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="rbEntryExitToWarehouse" id="rbEntryToWarehouse" value="I" checked>
                            <label class="form-check-label" for="rbEntryToWarehouse">Ulaz</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="rbEntryExitToWarehouse" id="rbExitFromWarehouse" value="O">
                            <label class="form-check-label" for="rbExitFromWarehouse">Izlaz</label>
                        </div>

                        <div class="input-group mb-3 form-floating">
                            <input type="text" id="tfRMCoordinates" class="form-control text-primary">
                            <label class="text-primary" for="tfRMCoordinates">RM Koordinate (xxyyyzz)</label>
                            <div class="invalid-feedback">
                                Neispravne koordinate. Ispravan format: xxyyyzz
                              </div>
                            <button class="btn btn-primary disabled" type="button" id="btnSend">
                                Pošalji
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col">
                <div class="card shadow-sm rounded">
                    <div class="card-header bg-dark text-white">Status aktivnog zahteva</div>
                    <div class="card-body">
                        <div class="progress">
                            <div id="progressBar" class="progress-bar progress-bar-striped" role="progressbar" style="width: 0%;">0%</div>
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm rounded mt-3">
                    <div class="card-header bg-dark text-white">Poruke aktivnog zahteva</div>
                    <div class="card-body" id="divStatusMessages"></div>
                </div>
            </div>
        </div>
	</div> <!-- container end -->

    <footer class="mt-auto px-3 py-2 bg-dark text-white">
        <div class="text-center p-3" style="background-color: rgba(0, 0, 0, 0.05);">
            Controller
        </div>
    </footer>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>

</html>
